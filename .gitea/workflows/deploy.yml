name: Deploy Hugo Blog

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: runner
    steps:
      - name: Checkout
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          git clone --recurse-submodules http://gitea.180636.xyz/levizheng/blog.git $GITHUB_WORKSPACE
          ls $GITHUB_WORKSPACE/themes/Amigo/layouts/_default/
          grep "moment-comments-area" $GITHUB_WORKSPACE/themes/Amigo/layouts/_default/single.html || echo "NOT FOUND"

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.163.3/hugo_0.163.3_linux-arm64.tar.gz
          tar -xzf hugo_0.163.3_linux-arm64.tar.gz

      - name: Build
        run: |
          ./hugo -d /opt/1panel/www/sites/blog/index