name: Deploy Hugo Blog

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: runner
    steps:
      - name: Checkout
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          git clone --recurse-submodules http://gitea.180636.xyz/levizheng/blog.git $GITHUB_WORKSPACE

      - name: Build
        run: |
          docker run --rm \
            -v $GITHUB_WORKSPACE:/site \
            -v /opt/1panel/www/sites/blog/index:/output \
            -w /site \
            klakegg/hugo:ext-ubuntu \
            hugo -d /output