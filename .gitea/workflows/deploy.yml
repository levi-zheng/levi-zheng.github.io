name: Deploy Hugo Blog

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: runner
    steps:
      - name: Debug
        run: |
          uname -m
          cat /etc/os-release | head -3

      - name: Checkout
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          git clone --recurse-submodules http://gitea.180636.xyz/levizheng/blog.git $GITHUB_WORKSPACE

      - name: Build
        run: |
          /usr/local/bin/hugo -d /opt/1panel/www/sites/blog/index